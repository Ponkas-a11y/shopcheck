services:
  shopcheck:
    build: .
    restart: unless-stopped
    # env_file: .env   <--- AUSKOMMENTIEREN, da SECRET_KEY in Portainer liegt
    ports:
      - "8080:8000"    # Linke Seite (8080) ist der Host-Port, rechte Seite (8000) muss 8000 bleiben!
    volumes:
      - shopcheck_data:/data
volumes:
  shopcheck_data:
